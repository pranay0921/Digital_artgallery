<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload Artwork - Digital Art Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/upload.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="nav">
        <div class="brand">Digital Art Gallery</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="upload.html" id="uploadLink">Upload</a>
            <a href="profile.html" id="profileLink">Profile</a>
            <a href="login.html" id="authLink">Login</a>
        </nav>
    </header>

    <main class="upload-page">
        <div class="upload-container">
            <h2>Upload Your Artwork</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <i class="fas fa-heading"></i>
                    <input type="text" id="title" name="title" placeholder="Enter artwork title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <i class="fas fa-align-left"></i>
                    <textarea id="description" name="description" placeholder="Describe your artwork" required></textarea>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <i class="fas fa-paint-brush"></i>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Painting">Painting</option>
                        <option value="3D">3D Art</option>
                        <option value="Anime">Anime</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Artwork Image</label>
                    <div class="file-upload">
                        <input type="file" id="image" name="image" accept="image/*" required>
                        <div class="file-upload-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag and drop your image or click to browse</p>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <i class="fas fa-tag"></i>
                    <div class="price-input">
                        <input type="number" id="price" name="price" min="1.00" step="0.01" placeholder="Enter price" required>
                    </div>
                    <small class="help-text">
                        <i class="fas fa-info-circle"></i> 
                        Minimum price: $1.00
                    </small>
                </div>

                <button type="submit" class="upload-btn">
                    <i class="fas fa-cloud-upload-alt"></i> Upload Artwork
                </button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
