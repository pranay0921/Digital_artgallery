<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile - Digital Art Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <header class="nav">
        <div class="brand">Digital Art Gallery</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="upload.html" id="uploadLink">Upload</a>
            <a href="profile.html" id="profileLink">Profile</a>
            <a href="login.html" id="authLink">Login</a>
        </nav>
    </header>

    <main class="container profile">
        <section class="card small" id="profileCard">
            <h2>Profile</h2>
            <div class="profile-info">
                <div class="profile-image-container">
                    <img id="profileImage" src="images/default-avatar.png" alt="Profile" class="avatar">
                    <div class="profile-image-actions">
                        <form id="profilePicForm" enctype="multipart/form-data">
                            <input type="file" id="profilePicInput" name="profilePic" accept="image/*">
                            <button type="button" class="btn" onclick="document.getElementById('profilePicInput').click()">
                                Change Picture
                            </button>
                        </form>
                        <button class="btn btn-danger" id="removePicBtn">Remove Picture</button>
                    </div>
                </div>
                <div id="profileDetails">
                    <!-- JS will populate profile details -->
                </div>
            </div>
        </section>
        <section id="userGallery" class="gallery">
            <h3>My Artworks</h3>
            <div class="artwork-grid">
                <!-- Artworks will be populated here -->
            </div>
        </section>

        <!-- Add artwork management modal -->
        <div id="editArtworkModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Edit Artwork</h2>
                <form id="editArtworkForm">
                    <input type="hidden" name="artworkId">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select name="category" required>
                            <option value="Painting">Painting</option>
                            <option value="3D">3D Art</option>
                            <option value="Anime">Anime</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" name="price" min="1.00" step="0.01" required>
                    </div>
                    <button type="submit" class="btn">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
